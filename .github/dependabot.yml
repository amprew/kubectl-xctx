version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let fresh releases age before proposing them: most compromised or
    # broken versions are yanked within the first few days.
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      # Minor/patch bumps land as one PR; majors stay separate so they get
      # an individual review.
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # github-actions only supports default-days (no per-semver cooldowns).
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      gh-actions:
        patterns: ["*"]
